# ==============================================================================
# ArgusAC - Independent Checks Configuration File (checks.yml)
# Centralized management of parameters and thresholds for all movement, combat, world interaction, and packet detection modules
# ==============================================================================

checks:
  # 1. Movement Speed Check (Speed)
  Speed:
    enabled: true
    max-vl: 15
    # Base maximum allowed horizontal displacement per 50ms movement tick (Vanilla normal sprint jump is approx. 0.61)
    max-horizontal-speed: 0.65
    # Extra acceleration multiplier for ice / packed ice friction
    ice-modifier: 1.45
    # Effect multiplier per level of Speed potion
    speed-potion-multiplier: 0.20
    # Violation buffer capacity (used to absorb minor single-tick network jitter and discrete physical variance of continuous jumping; tuned to 0.25 on par with mature anti-cheats)
    speed-buffer-max: 0.25
    # Buffer decay amount for each legal movement tick
    speed-buffer-decay: 0.10

  # 2. Flight and Gravity Check (Fly)
  Fly:
    enabled: true
    max-vl: 12
    # Maximum allowed airborne ticks (Vanilla jump max is only 11 ticks; tightened to 12 ticks for instant detection of excessive air time)
    max-air-ticks: 12
    # Abnormal upward vertical displacement threshold without Jump Boost potion effect
    vertical-ascent-threshold: 0.42

  # 3. Fake Ground Check (NoFall)
  NoFall:
    enabled: true
    max-vl: 15
    # Tolerance distance when the client claims onGround=true but there is no solid block underfoot
    ground-check-tolerance: 0.001

  # 4. Attack Reach Check (Reach)
  Reach:
    enabled: true
    max-vl: 15
    # Theoretical limit for maximum attack reach in Survival mode (blocks)
    max-reach: 3.10
    # Maximum allowed distance combined with Ping latency compensation and knockback margin
    max-ping-reach: 3.50

  # 5. AutoClicker Check (AutoClicker)
  AutoClicker:
    enabled: true
    max-vl: 15
    # Maximum allowed clicks per second (CPS)
    max-cps: 18
    # Minimum standard deviation of click time differences (used to detect mechanical, jitter-free uniform clicks from macros)
    min-std-deviation: 4.5

  # 6. KillAura Check
  # Uses a purely silent instant cancellation mechanism to prevent damage penetration, without intrusive disarming
  KillAura:
    enabled: true
    max-vl: 18
    # Maximum allowed angle between line of sight center and target during attack (degrees)
    max-angle: 68.0
    # Checks if there are solid blocks blocking the line of sight between attacker and victim (prevents hitting through walls)
    raytrace-blocks: true
    # Shortest allowed millisecond interval for rapidly switching between different targets (prevents instant 1vN multi-target attacks)
    target-switch-ms: 80
    # Intercepts blind spot and backwards/reverse attacks (> 90.0 degrees)
    blindspot-check: true
    # Instant aimbot snap detection
    snap-check: true
    # Yaw angle sudden change threshold to be determined as an instant snap (degrees)
    snap-angle-threshold: 45.0

  # 7. Knockback Momentum Response Check (Velocity / Anti-KB)
  Velocity:
    enabled: true
    max-vl: 15
    # Expected vertical response ratio after receiving knockback (values below this are considered vertical anti-knockback)
    vertical-ratio: 0.85
    # Expected horizontal response ratio after receiving knockback
    horizontal-ratio: 0.80

  # 8. FastBow and Gatling Bow Cheat Check (FastBow)
  # Deep defense against instant arrows, high-frequency Gatling shooting, charge bypass, and FakeLag/Blink latency packet spamming (Packet Spoof)
  FastBow:
    enabled: true
    max-vl: 12
    # Minimum allowed charge ticks for full charge (force >= 0.8) (Vanilla full draw is 20 ticks / 1000ms, relaxed with 2 ticks tolerance)
    min-charge-ticks: 18
    # Minimum allowed charge milliseconds for full charge
    min-charge-ms: 850
    # Absolute minimum millisecond interval between two shots (prevents rapid-fire Gatling cheats)
    min-shot-interval-ms: 250
    # Maximum allowed arrow shots within a 1000ms sliding window (prevents delayed packet spamming)
    max-shots-per-second: 3
    # Violation mitigation mode (only CANCEL and NERF modes are retained):
    # CANCEL: Silently cancels the shot and removes the arrow entity (default recommended)
    # NERF: Nerfs into a weak arrow at the feet (initial velocity forcefully reduced to zero, dropping vertically)
    mitigation-mode: "CANCEL"

  # 9. Fast Eating and Abnormal Item Usage Check (FastEat)
  # Deep defense against sending completion packets early (Packet Spoofing), Timer stepping acceleration, and instant potion/food/golden apple cheats
  FastEat:
    enabled: true
    max-vl: 12
    # Normal eating takes 32 ticks (1600ms); minimum allowed eating ticks (considering a 2-4 ticks tolerance)
    min-allowed-ticks: 28
    # Minimum allowed eating milliseconds (default 1200ms)
    min-allowed-ms: 1200
    # Whether to enable network jitter compensation based on player Ping latency
    lag-compensation: true
    # Violation mitigation mode (CANCEL: silently cancels eating and resyncs held item to prevent fake client-side consumption)
    mitigation-mode: "CANCEL"

  # 9. Fast Break Check (FastBreak)
  FastBreak:
    enabled: true
    max-vl: 15
    # Allowed percentage exceeding theoretical block hardness breaking time (0.20 = allows being 20% faster)
    time-leniency: 0.20

  # 9. Nuker / Mass Block Break Check (Nuker)
  Nuker:
    enabled: true
    max-vl: 12
    # Maximum allowed blocks broken per single tick (Vanilla client is 1)
    max-breaks-per-tick: 2
    # Maximum blocks broken per second without Haste II effect
    max-breaks-per-second: 15

  # 10. Scaffold Check (Scaffold)
  Scaffold:
    enabled: true
    max-vl: 15
    # Abnormal downward pitch angle threshold when placing blocks underfoot (degrees)
    min-pitch: 70.0

  # 11. Inventory Move Check (InventoryMove)
  InventoryMove:
    enabled: true
    max-vl: 10
    # Maximum allowed movement distance while a container interface like inventory or chest is open
    max-distance-while-open: 0.15

  # 12. Protocol and Packet Anomaly Check (BadPackets)
  BadPackets:
    enabled: true
    max-vl: 10
    # Strict pitch angle constraint [-90.0, 90.0] (prevents Derp / upside-down pitch cheats)
    strict-pitch: true
    # Checks for duplicate redundant position packets during ascent
    check-duplicate-move: true
    # Protocol-level 50ms clock drift balance check (prevents 1.05x ~ 2.0x speedhacks and packet spamming)
    timer-check: true

  # 13. Elytra Flight and Armor-Fly Cheat Check (ElytraFly / PacketFly / Control Mode)
  # Comprehensive defense against "Armor-Fly" cheats via spoofed glide packets, armor-swap exploits, unpowered ascent, infinite level flight, and mid-air hovering
  ElytraFly:
    enabled: true
    max-vl: 15

    # Exemption durations for physical environments and legal propulsion
    exemptions:
      # Firework rocket boost exemption period (ms)
      firework-boost-duration-ms: 1500
      # Riptide trident exemption period (ms)
      riptide-duration-ms: 2000
      # Explosion and external momentum impact exemption period (ms)
      external-velocity-duration-ms: 1200
      # Initial takeoff glide grace period (ms)
      takeoff-grace-duration-ms: 1000
      # Automatically relaxes detection when server TPS drops below this threshold
      min-server-tps: 17.5

    # Sub-item 1: Maximum horizontal glide speed and dive kinetic energy conversion
    speed:
      enabled: true
      max-unboosted-speed: 1.45
      max-boosted-speed: 2.60
      pitch-dive-multiplier: 0.55
      min-vl: 3
      setback-mode: "CANCEL"

    # Sub-item 2: Abnormal unpowered ascent (strict constraint via law of conservation of mechanical energy)
    ascend:
      enabled: true
      max-vertical-ascent: 0.15
      ascend-ticks-threshold: 3
      lawful-min-prior-speed: 0.70
      lawful-min-decay: 0.015
      min-vl: 3
      setback-mode: "CANCEL"

    # Sub-item 3: Zero-momentum mid-air hover and fixed-altitude infinite level flight (prevents PacketFly suspended AFK and Control Mode)
    hover:
      enabled: true
      max-horizontal-speed: 0.08
      max-vertical-speed: 0.05
      hover-ticks-threshold: 12
      max-unpowered-level-ticks: 12
      min-vl: 3
      setback-mode: "CANCEL"

    # Sub-item 4: Abnormal continuous high speed with fireworks (intercepts unpropelled spontaneous acceleration and infinite high-speed cruising)
    firework:
      enabled: true
      min-unpropelled-accel: 0.08
      continuous-high-speed-ticks: 20
      min-vl: 3
      setback-mode: "CANCEL"

    # Sub-item 5: Real-time strict validation of chestplate slot 38 equipment and durability (prevents unequipped flying, 0-durability fake deployment, and armor-swap timing bypasses)
    glide-state:
      enabled: true
      check-chestplate-durability: true
      armor-swap-cancel: true
      rapid-swap-threshold-ms: 150
      min-vl: 1
      setback-mode: "CANCEL"

    # Sub-item 6: High-frequency glide packet interval check (Timer speedhack clock balance)
    timer:
      enabled: true
      sample-window-size: 20
      min-average-interval-ms: 44.0
      min-vl: 3
      setback-mode: "CANCEL"

    # Sub-item 7: Extremely fast Elytra glide posture toggling (GlideFlip rate-limit interception)
    flip:
      enabled: true
      window-ms: 1000
      max-toggles: 4
      min-vl: 3
      setback-mode: "CANCEL"

    # Sub-item 8: Near-ground glide toggle exploit to negate fall damage (repeated abuse detection)
    nofall:
      enabled: true
      min-fall-distance: 3.0
      ground-proximity-distance: 1.8
      min-vl: 3
      setback-mode: "CANCEL"

  # 14. Water Walking and Fake Water Surface Hover Check (Jesus)
  Jesus:
    enabled: true
    max-vl: 12
    # Immediate interception of fake ground-state on water surface
    detect-ground-spoof: true
    # Maximum allowed horizontal speed for water surface movement (blocks/tick)
    max-water-speed: 0.28
    # Maximum allowed ticks for locked zero vertical displacement on water surface
    max-solid-hover-ticks: 4
    # Cumulative detection limit in ticks for continuous staying on water surface
    max-water-surface-ticks: 15
    # Vertical oscillation reset threshold
    vertical-reset-threshold: 0.12

  # 15. Heavy Mace Combat & Damage Exploit Check (Mace / MaceDMG)
  # Deep defense against 1.21+ MaceDMG exploits, fake fall distance, ground smash, impossible fall velocity, and Wind Burst abuse
  Mace:
    enabled: true
    max-vl: 12
    # Check if a smash attack is performed while grounded or without sufficient fall distance (Vanilla requires > 1.5 blocks fall)
    check-ground-smash: true
    # Validate reported fall distance against true physical apex height (prevents Y-spoofing and packet-inflated fall distance)
    check-apex-fall: true
    # Allowed height tolerance in blocks between true physical apex and reported fall distance
    apex-tolerance: 0.85
    # Validate whether the fall distance is physically achievable within the elapsed airborne ticks (kinematic gravity constraint)
    check-impossible-fall-speed: true
    # Check if damage dealt exceeds theoretical maximum (base + fall scaling + Density V + Strength + Crits)
    check-damage-cap: true
    # Absolute maximum allowed single-hit damage cap for Mace attacks (0 = disabled, default 48.0 = 24 hearts)
    max-damage-limit: 48.0
    # Minimum interval in milliseconds between consecutive Mace smash attacks (prevents rapid-fire smash exploits)
    min-smash-interval-ms: 350
    # Violation mitigation mode:
    # CANCEL: Silently cancels the attack and zeroes the damage (recommended)
    # NERF: Reduces damage to verified legitimate maximum (or base weapon damage) and resets spoofed fall distance
    mitigation-mode: "CANCEL"
    # Action on reaching max VL:
    setback-mode: "CANCEL"