# ==============================================================================
# ArgusAC - Simplified Chinese Language File (zh_cn.yml)
# Supports MiniMessage formatting (e.g. <red>, <bold>, <gradient:#55cdfc:#f7a8b8>)
# as well as legacy color codes (e.g. &a, &c, &e, &#RRGGBB)
# ==============================================================================

# Global plugin prefix
prefix: "<gradient:#00C9FF:#92FE9D>[ArgusAC]</gradient>&r "

# System and administrative console messages
system:
  reload-success: "<green>所有配置文件、检测规则与多语言文件已成功热重载！耗时: <yellow>{time}ms</yellow></green>"
  reload-failed: "<red>配置文件重载失败，已安全回退到此前版本，详情请查看控制台日志！</red>"
  no-permission: "<red>权限不足！执行反作弊管理命令需要: <yellow>{permission}</yellow></red>"
  only-player: "<red>该命令只能由游戏内玩家执行！</red>"
  unknown-command: "<red>未知的子命令: <yellow>{subcommand}</yellow>。输入 <gray>/argus help</gray> 查看命令列表。</red>"
  target-not-found: "<red>未找到目标玩家: <yellow>{target}</yellow>（玩家不在线或不存在）</red>"
  audit-backlog: "<red>[ArgusAC 警告] 审计日志队列积压已达 {size}/{capacity} ({ratio}%)！请注意磁盘 I/O！</red>"
  packet-pipeline-ready: "[PacketPipeline] PacketEvents 跨版本数据包引擎已挂载就绪 (PacketListener registered)"
  packet-pipeline-failed: "[PacketPipeline] 挂载 PacketEvents 监听器失败"

# Check category names
check:
  type:
    movement: "移动"
    combat: "战斗"
    world: "世界交互"
    packet: "数据包"

# Cheat detection alert messages (sent to staff)
alert:
  format: "<dark_gray>[</dark_gray><aqua>Argus</aqua><dark_aqua>AC</dark_aqua><dark_gray>]</dark_gray> <gray>玩家</gray> <red>{player}</red> <gray>触发检测</gray> <gold>{check}</gold> <dark_gray>(</dark_gray><yellow>{type}</yellow><dark_gray>)</dark_gray> <gray>VL: <red>{vl}</red>/<dark_red>{max_vl}</dark_red> <dark_gray>[<gray>Ping: <green>{ping}ms</green> <gray>TPS: <green>{tps}</green><dark_gray>]</dark_gray>"
  hover-details: "<yellow>点击传送至玩家所在位置</yellow>\n<gray>详细信息: <white>{detail}</white>"

# Mitigation and punishment messages
punishment:
  setback-notify: "<red>检测到异常移动行为，位置已平滑重置！</red>"
  combat-throttle-notify: "<red>[ArgusAC] 检测到异常战斗行为，近战攻击能力已被暂时抑制！</red>"
  setback-admin: "<gold>[Setback]</gold> <yellow>{player}</yellow> <gray>因</gray> <red>{check}</red> <gray>已被回退</gray> <dark_gray>(</dark_gray><white>{old_loc}</white> <dark_gray>-></dark_gray> <green>{new_loc}</green><dark_gray>)</dark_gray> <dark_gray>[</dark_gray><aqua>{mode}</aqua><dark_gray>]</dark_gray>"
  kick-reason: "<red>[ArgusAC] 您的客户端行为异常，已被移出服务器。\n<gray>触发检测: <yellow>{check}</yellow> <gray>(代码: <white>{code}</white>)</gray>"
  ban-reason: "<red>[ArgusAC] 您的账户因违规行为已被封禁。\n<gray>原因: <yellow>{reason}</yellow>\n<gray>如有异议请联系管理员申诉。</gray>"

# Command help menu entries
help:
  header: "<dark_gray>================= <gradient:#00C9FF:#92FE9D>ArgusAC 反作弊帮助菜单</gradient> <dark_gray>================="
  footer: "<dark_gray>====================================================="
  entries:
    - "<yellow>/argus help</yellow> <dark_gray>-</dark_gray> <gray>查看本帮助菜单</gray>"
    - "<yellow>/argus reload</yellow> <dark_gray>-</dark_gray> <gray>热重载配置文件与语言包</gray>"
    - "<yellow>/argus status</yellow> <dark_gray>-</dark_gray> <gray>查看服务器当前检测模块运行状态与日志指标</gray>"
    - "<yellow>/argus vl <玩家></yellow> <dark_gray>-</dark_gray> <gray>查询指定玩家的当前违规值 (VL)</gray>"
    - "<yellow>/argus logs <玩家></yellow> <dark_gray>-</dark_gray> <gray>查询指定玩家的内存快速违规审计记录</gray>"
    - "<yellow>/argus history <玩家> <天数></yellow> <dark_gray>-</dark_gray> <gray>异步流式检索历史日志文件 (含压缩包)</gray>"
    - "<yellow>/argus replay <玩家> [--side]</yellow> <dark_gray>-</dark_gray> <gray>ASCII 轻量轨迹与高度可视化回放</gray>"
    - "<yellow>/argus export <玩家></yellow> <dark_gray>-</dark_gray> <gray>导出指定玩家的完整审计数据 Zip 归档</gray>"
    - "<yellow>/argus top [--since <1h|24h|7d>]</yellow> <dark_gray>-</dark_gray> <gray>查看违规次数最高的玩家 Top10 榜单</gray>"
    - "<yellow>/argus verify</yellow> <dark_gray>-</dark_gray> <gray>异步核验全局日志链 SHA-256 签名完整性</gray>"
    - "<yellow>/argus debug <检测项></yellow> <dark_gray>-</dark_gray> <gray>实时开关独立检测模块调试日志</gray>"
    - "<yellow>/argus my-data</yellow> <dark_gray>-</dark_gray> <gray>查看自身反作弊数据保留策略 (GDPR)</gray>"
    - "<yellow>/argus purge <玩家></yellow> <dark_gray>-</dark_gray> <gray>彻底安全清除指定玩家的审计记录</gray>"
    - "<yellow>/argus compat</yellow> <dark_gray>-</dark_gray> <gray>查看多版本跨环境运行能力矩阵与降级状态</gray>"
    - "<yellow>/argus toggle <检测项></yellow> <dark_gray>-</dark_gray> <gray>实时开启或停用单项反作弊检测</gray>"
    - "<yellow>/argus setback <玩家|global> <模式></yellow> <dark_gray>-</dark_gray> <gray>运维控制与诊断状态回退子系统</gray>"
    - "<yellow>/argus alerts [on|off|status]</yellow> <dark_gray>-</dark_gray> <gray>本次登录期间关闭或恢复个人告警提示</gray>"

# Detailed command feedback messages
command:
  vl:
    usage: "<red>用法: /{label} vl <玩家名></red>"
    header: "<gradient:#00C9FF:#92FE9D>=== 玩家 {player} 当前违规信息 ===</gradient>"
    summary: "<gray>延迟 (Ping): <white>{ping}ms</white> <dark_gray>|</dark_gray> 总 VL: <red>{total_vl}</red>"
    clean: "<green>当前没有任何违规记录，状态良好！</green>"
    entry: "  <dark_gray>-</dark_gray> <gray>{check}:</gray> <red>{vl}</red><dark_gray>/</dark_gray><gray>{max_vl}</gray>"
  logs:
    usage: "<red>用法: /{label} logs <玩家名> [--check <name>] [--since <1h|24h|7d>] [--setback] [--page <n>]</red>"
    empty: "<gray>玩家 <yellow>{player}</yellow> 在内存快速缓冲中无匹配记录。</gray>"
    header: "<yellow>=== {title} (第 {page}/{total_pages} 页) ===</yellow>"
    title-memory: "内存快速日志 (近 {count} 条)"
    title-history: "历史审计档案 (共 {count} 条)"
    admin-format: "&8[{time}] &dADMIN &7{actor} 执行 &e{action} &7目标:&b{target}"
    integrity-format: "&8[{time}] &5INTEGRITY &7行数:&f{count}"
  history:
    usage: "<red>用法: /{label} history <玩家名> <查询天数> [--check <name>] [--setback] [--page <n>]</red>"
    searching: "<gray>正在异步流式检索历史日志档案 (含 .jsonl.gz)...</gray>"
    empty: "<gray>未在历史日志归档中找到匹配记录。</gray>"
  export:
    usage: "<red>用法: /{label} export <玩家名></red>"
    exporting: "<gray>正在打包玩家 <yellow>{player}</yellow> 的审计历史数据...</gray>"
    success: "<green>导出完成！数据包已生成: <yellow>{path}</yellow> (共 {count} 条记录)</green>"
    failed: "<red>导出日志失败，请查看控制台！</red>"
  top:
    header: "<gradient:#00C9FF:#92FE9D>=== 近期违规次数 TOP 10 榜单 ===</gradient>"
    empty: "<green>在此统计时间窗口内没有产生任何严重作弊违规记录！</green>"
    entry: " <gold>#{rank}</gold> <yellow>{player}</yellow> <dark_gray>-</dark_gray> <gray>主要检测: <yellow>{check}</yellow></gray> <dark_gray>|</dark_gray> <gray>总VL: <red>{total_vl}</red></gray> <dark_gray>|</dark_gray> <gray>回退拦截: <gold>{setbacks} 次</gold></gray>"
  status:
    header: "<gradient:#00C9FF:#92FE9D>=== ArgusAC 统一审计与运行时健康指标 ===</gradient>"
    env: "<gray>运行内核环境: <aqua>{env}</aqua> <dark_gray>({core})</dark_gray></gray>"
    adapter: "<gray>活跃适配实现: <white>{adapter}</white></gray>"
    degraded: "<gray>版本降级状态: <yellow>存在降级/挂起模块</yellow> <dark_gray>(输入 <white>/argus compat</white> 查看)</dark_gray></gray>"
    full: "<gray>版本降级状态: <green>全模块完整原生支持 (Full Performance)</green></gray>"
    queue: "<gray>日志队列积压: <yellow>{queue_size}</yellow> / {capacity} <dark_gray>|</dark_gray> 内存违规条目: <yellow>{memory_count}</yellow></gray>"
    chain: "<gray>哈希链高度: <white>#{chain_index}</white> <dark_gray>|</dark_gray> 根哈希: <aqua>{hash}</aqua></gray>"
    archive: "<gray>历史归档文件数: <white>{archive_count}</white> <dark_gray>|</dark_gray> 存储占用: <white>{size}</white></gray>"
    flush-time: "<gray>最近落盘时间: <white>{time}</white>{dropped}</gray>"
    memory-high: "偏高"
    memory-healthy: "健康"
    dropped-hint: "&8(&c丢弃: {dropped}&8)"
  compat:
    header: "<gradient:#00C9FF:#92FE9D>=== ArgusAC 跨版本运行兼容矩阵 ===</gradient>"
    env: "<gray>当前服务器环境: <aqua>{env}</aqua> <dark_gray>(编码: <white>{code}</white>) | 核心: <dark_aqua>{core}</dark_aqua></gray>"
    adapter: "<gray>当前适配器实现: <white>{adapter}</white></gray>"
    divider: "<dark_gray>--------------------------------------------------</dark_gray>"
    legend: "<green>FULL: 满血防护</green>  <yellow>DEGRADED: 几何/旧版平替</yellow>  <red>DISABLED: 机制缺失静默挂起</red>"
  debug:
    usage: "<red>用法: /{label} debug <检测模块名></red>"
    result: "<gray>检测项 <aqua>{check}</aqua> 独立调试日志: {status}</gray>"
  replay:
    usage: "<red>用法: /{label} replay <玩家名> [--side]</red>"
    empty: "<red>该玩家近期 60 秒内无可用移动轨迹数据。</red>"
    no-coords: "&c无有效轨迹坐标可回放。"
    view-side: "XY 侧视图"
    view-top: "XZ 俯视图"
    header: "&e=== 移动轨迹 ASCII 取证回放: &b{player} &e({view}) ==="
    info: "&7检测项: &c{check} &8| &7严重度: &e{severity} &8| &7回退模式: &b{mode}"
    coords: "&7起点(S): &a{from} &8-> &7回退点(X): &c{to}"
    height-bar: "&7[高度条]"
    legend: "&7图例: &aS&7=最后合法起点, &e*&7=异常越界位移, &cX&7=强制回退点"
  verify:
    running: "<yellow>正在后台多线程验证审计日志 SHA-256 哈希链签名，请稍候...</yellow>"
    success: "<green>哈希链审计验证通过！所有日志数据完整且未经任何外部篡改。</green>"
    failed: "<red>警告！哈希链在第 {line} 行检测到签名不匹配，数据可能曾遭受非授权修改！</red>"
  toggle:
    usage: "<red>用法: /{label} toggle <检测名称></red>"
    not-found: "<red>未找到名为 <yellow>{check}</yellow> 的检测模块！</red>"
    result: "<green>检测模块 <yellow>{check}</yellow> 状态已更新为: {status}</green>"
  setback:
    usage: "<red>用法: /{label} setback <玩家名|global> <disable|soft|hard|default|now|info></red>"
    param-error: "<red>参数错误，请使用 on 或 off</red>"
    data-error: "<red>无法获取该玩家运行时数据。</red>"
    fail-blocked: "<red>回退失败，该玩家暂无可用合法位置或目标已被阻挡。</red>"
    info-header: "<gradient:#00C9FF:#92FE9D>=== 玩家 {player} 回退上下文诊断 ===</gradient>"
    info-detail: "<gray>单人覆写: <yellow>{override}</yellow> <dark_gray>|</dark_gray> 免疫剩余: <aqua>{immunity}ms</aqua> <dark_gray>|</dark_gray> 独立冷却: <yellow>{cooldown}</yellow></gray>"
    info-last: "<gray>最新有界合法点: <green>{last_loc}</green></gray>"
    override-set: "<green>玩家 <yellow>{player}</yellow> 的单人回退覆写策略已设为: <aqua>{override}</aqua></green>"
    global-toggle: "<green>全局回退机制总开关已切换为: {status}</green>"
    triggered: "<yellow>已为玩家 <gold>{player}</gold> 手动触发一次立即平滑回退！</yellow>"
  alerts:
    usage: "<red>用法: /argus alerts [on|off|status]</red>"
    enabled: "<green>本次登录期间已恢复接收告警提示。</green>"
    muted: "<yellow>本次登录期间已关闭个人告警提示；服务器仍会记录日志并向控制台输出。</yellow>"
    status-enabled: "<green>当前会话正在接收告警提示。</green>"
    status-muted: "<yellow>当前会话已关闭告警提示。</yellow>"
  my-data:
    header: "<gradient:#00C9FF:#92FE9D>=== ArgusAC 个人数据合规透明度 ===</gradient>"
    retention: "<gray>数据保存期限: <yellow>{days} 天</yellow> (期满自动执行不可逆安全清理)</gray>"
    anonymization: "<gray>IP 隐私保护: <yellow>{status}</yellow></gray>"
    purge-hint: "<gray>申请完全注销或彻底移除记录，请联系管理员执行: <yellow>/argus purge {player}</yellow></gray>"
  purge:
    usage: "<red>用法: /{label} purge <玩家名></red>"
    success: "<green>已彻底清除玩家 <yellow>{player}</yellow> 的全部反作弊数据，并已写入系统注销审计日志。</green>"

# Multi-version compatibility descriptions and diagnostics
compat:
  status:
    full: "&a完整支持"
    degraded: "&e降级运行"
    disabled: "&c版本禁用"
  reason:
    default: "正常运转"
    elytrafly-disabled: "Minecraft 1.9 以前不存在滑翔机制"
    elytrafly-full: "完整支持滑翔姿态采样"
    speed-degraded: "1.13 以前无 swimming 姿态，在水中采用老版浮力模型推算"
    speed-full: "支持确定性物理运动模拟预测与原生碰撞盒"
    fly-full: "支持确定性重力加速度预测模拟与高度边界计算"
    fly-legacy: "基础位移向量与重力加速度全版本支持"
    reach-degraded: "无 Entity#getBoundingBox，采用 0.6x1.8 盒状近似计算"
    reach-full: "支持原生精确碰撞盒交互距离运算"
    badpackets-degraded: "当前依赖 Bukkit 事件层近似校验，数据包级协议状态机待挂载"
    badpackets-full: "PacketEvents 数据包协议引擎已激活，完整支持底层时序与数据包校验"
    nofall-full: "坠落动量与地面状态全版本支持"
    fastbreak-full: "方块挖掘时序全版本支持"
    scaffold-full: "搭建朝向与视线交点全版本支持"
    inventorymove-full: "背包开启状态监听全版本支持"
    jesus-full: "水上行走、水面虚假接地与水面平飞全版本支持"
    fasteat-full: "物品食用时钟与网络延迟补偿全版本支持"
    mace-disabled: "Minecraft 1.21 以前不存在重锤机制"
    mace-full: "完整支持重锤下落坠击、物理真峰值与超限伤害校验"
  diag:
    ready: "多版本自适应环境自检就绪:"
    core: "识别内核: {core} ({type})"
    code: "版本编码: {code}"
    adapter: "适配器通道: {adapter}"
    matrix: "模块能力矩阵: {count} 个检测项已分配运行等级"
    degraded-notice: "[提示] 检测到部分模块运行在降级兼容模式，使用 /argus compat 可查看详情。"

